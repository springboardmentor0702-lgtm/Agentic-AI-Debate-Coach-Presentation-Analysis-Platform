version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROK_API_KEY=${GROK_API_KEY:-}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      # Uses SQLite by default (speakaz.db) — no database server needed.
      # To use MySQL/PostgreSQL, uncomment and set DATABASE_URL:
      # - DATABASE_URL=mysql+pymysql://root:password@db:3306/speakaz
    volumes:
      - ./backend:/app/backend
      - ./aiml:/app/aiml
      - ./ai-ml:/app/ai-ml
      - speakaz_data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

volumes:
  speakaz_data:
