services:

  # PostgreSQL Primary Database
  db:
    image: postgres:16-alpine
    container_name: debate_coach_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: debate_user
      POSTGRES_PASSWORD: debate_password
      POSTGRES_DB: debate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debate_user -d debate_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FastAPI Microservices Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: debate_coach_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://debate_user:debate_password@db:5432/debate_db
      SECRET_KEY: super-secret-debate-coach-jwt-key-2026
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,*
    depends_on:
      db:
        condition: service_healthy

  # Next.js Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: debate_coach_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
