services:

  api:

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    environment:

      DATABASE_URL: postgresql://debate_user:debate_password@db:5432/debate_db

      CORS_ORIGINS: http://localhost:3000,http://localhost:5173

    depends_on:

      db:
        condition: service_healthy


  db:

    image: postgres:16

    environment:

      POSTGRES_USER: debate_user

      POSTGRES_PASSWORD: debate_password

      POSTGRES_DB: debate_db

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U debate_user -d debate_db"
        ]

      interval: 5s

      timeout: 5s

      retries: 10


volumes:

  postgres_data:
